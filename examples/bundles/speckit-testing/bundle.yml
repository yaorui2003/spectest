schema_version: "1.0"

bundle:
  id: "speckit-testing"
  name: "Speckit Testing"
  version: "1.1.0"
  role: "developer"
  description: "Spec 驱动测试先行全套件：testing 扩展（4 命令 + after_implement 钩子 [impact,gate] + 4 扫描脚本 + 5 模板 + 技术栈必需前置）+ testing-tdd preset（强制 TDD + 骨架先行 + 单测先行 + 预置宪法 Principle I + spec-template + implement 约定参考）。一键装齐 Spec-Code-Test 三角一致性闭环。"
  author: "spec-kit-core"
  license: "MIT"

requires:
  speckit_version: ">=0.14.4"
  tools: []
  mcp: []

provides:
  extensions:
    - id: "testing"
      version: "1.1.0"
  presets:
    - id: "testing-tdd"
      version: "1.1.0"
      priority: 10
      strategy: "replace"

tags:
  - "testing"
  - "tdd"
  - "traceability"
  - "gate"
  - "spec-driven"
