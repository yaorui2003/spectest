schema_version: "1.0"

extension:
  id: testing
  name: Speckit Testing
  version: 1.5.0
  description: "Spec 驱动测试先行验证，含 @Spec 注解追溯与自动门禁（技术栈必需前置 + 脚本化 + 硬校验）。v1.5：仅保留单元测试要求（删除契约测试与前端测试/e2e 支持）"
  author: speckit-core
  repository: https://github.com/yaorui2003/spectest
  license: MIT
  category: testing
  effect: read-write

requires:
  speckit_version: ">=0.2.0"
  commands:
    - speckit.plan
    - speckit.tasks
    - speckit.implement

provides:
  commands:
    - name: speckit.testing.impact
      file: commands/speckit.testing.impact.md
      description: "变更影响分析"
    - name: speckit.testing.plan
      file: commands/speckit.testing.plan.md
      description: "测试计划生成"
    - name: speckit.testing.gate
      file: commands/speckit.testing.gate.md
      description: "自动化门禁"
    - name: speckit.testing.report
      file: commands/speckit.testing.report.md
      description: "测试报告"

  templates:
    - name: java-service-template
      file: templates/java-service.template.java
      description: "Java Service 代码模板（带 @Spec 注解占位符）"
    - name: java-unit-test-template
      file: templates/java-unit-test.template.java
      description: "单测模板（JUnit5 @DisplayName / JUnit4 测试方法级 @Spec 规则标注）"
    - name: test-plan-template
      file: templates/test-plan-template.md
      description: "测试计划文档模板"
    - name: spec-trace-matrix-template
      file: templates/spec-trace-matrix.md
      description: "Spec 追溯矩阵模板"

  scripts:
    - name: scan-spec-annotations
      file: scripts/python/scan_spec_annotations.py
      description: "@Spec 注解扫描脚本（Python 推荐）"
      runtimes: [python]
    - name: validate-spec-format
      file: scripts/python/validate_spec_format.py
      description: "spec.md 格式验证脚本（Business Rules 段 + 规则编号连续性）"
      runtimes: [python]
    - name: parse-test-results
      file: scripts/python/parse_test_results.py
      description: "Surefire + JaCoCo 测试结果解析脚本"
      runtimes: [python]
    - name: scan-test-stack
      file: scripts/python/scan_test_stack.py
      description: "测试技术栈硬校验脚本（禁 PowerMock / @SpringBootTest / @Autowired）"
      runtimes: [python]
    - name: run-gate
      file: scripts/python/run_gate.py
      description: "门禁编排脚本（全逻辑下沉，AI 仅读结果）"
      runtimes: [python]

  config:
    - name: testing-config.yml
      template: config/testing-config.template.yml
      description: "门禁阈值与风险分级配置"
      required: false

hooks:
  after_implement:
    - command: speckit.testing.impact
      optional: false
      description: "实现后基于 git diff 做影响分析 + 风险分级"
    - command: speckit.testing.gate
      optional: false
      description: "代码实现后自动跑门禁"

tags:
  - testing
  - traceability
  - gate
  - spec-driven