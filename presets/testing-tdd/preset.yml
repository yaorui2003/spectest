schema_version: "1.0"

preset:
  id: "testing-tdd"
  name: "Speckit Testing TDD Enforcement"
  version: "1.0.0"
  description: "强制 TDD 任务顺序 + 预置宪法 Principle VI（@Spec 可追溯）+ implement 引用 @Spec 模板。配合 testing 扩展使用。"
  author: "spec-kit-core"
  repository: "https://github.com/github/spec-kit"
  license: "MIT"

requires:
  # wrap/append 组合策略需 0.14.4+ 运行时解析基线（同 constitution-sync）
  speckit_version: ">=0.14.4"

provides:
  templates:
    # 预置宪法 Principle VI（Spec Traceability）-- replace 整个模板
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "预置 Principle VI（Spec Traceability）的宪法模板，/speckit.constitution 生成时即含 @Spec 软约束"
      replaces: "constitution-template"
      strategy: "replace"

    # 强制 TDD -- replace 核心 tasks-template，把 OPTIONAL 改 REQUIRED，消灭矛盾
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "完整替换核心 tasks-template：测试必需（REQUIRED）+ 测试任务前置，消灭 OPTIONAL 矛盾"
      replaces: "tasks-template"
      strategy: "replace"

    # 强制 @Spec 注解 + 引用模板 -- append 到核心 implement 命令
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "implement 时强制 @Spec 注解 + resolve java-service-template，落实宪法 Principle VI"
      replaces: "speckit.implement"
      strategy: "append"

tags:
  - "testing"
  - "tdd"
  - "traceability"
  - "constitution"
